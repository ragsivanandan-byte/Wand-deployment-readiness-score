# Golden cases — well-formed earnings transcripts. The workflow should
# produce a clean note that matches the expected output for each.
cases:
  - id: golden_aapl_beat_raise
    capability: writer
    prompt: "Summarise the quarter and provide a directional rating."
    context: |
      ACME Corp Q3 FY26 earnings call. CFO: "Revenue came in at $12.4B, up 9% YoY,
      ahead of the $12.1B consensus. Diluted EPS of $2.18 beat the $2.05 Street
      estimate. We're raising full-year revenue guidance to $48.5–49.0B, up from
      $47.0–48.0B previously, on the back of strong AI services adoption and tight
      operating expense control."
    expected: |
      Beat on revenue and EPS, guidance raised, rating constructive. Drivers:
      AI services growth and OpEx discipline.
    must_contain: ["$12.4B", "$2.18", "raised"]
    must_not_contain: ["$99", "40% growth in Q4"]

  - id: golden_msft_inline_maintained
    capability: writer
    prompt: "Summarise the quarter and provide a directional rating."
    context: |
      Globex Inc Q2 FY26. Revenue of $61.9B in line with the $61.8B consensus.
      EPS $2.93 vs $2.90 consensus. Management maintained full-year guidance and
      cited stable cloud growth and a 2pt FX headwind.
    expected: |
      In-line beat, guidance maintained, rating neutral.
    must_contain: ["$61.9B", "$2.93", "maintained"]
    must_not_contain: ["raised", "lowered"]

  - id: golden_nvda_strong_beat
    capability: writer
    prompt: "Provide a 4-sentence beat/miss note with rating."
    context: |
      Initech Q1 FY27. Revenue $30.0B vs $28.4B consensus (+5.6%). EPS $5.16 vs
      $4.62 (+11.7%). Data center revenue $22.6B. Guidance raised to $32.0B for
      next quarter vs $30.5B Street. CEO: "Demand for accelerated computing is
      broadening."
    expected: |
      Significant beat across revenue and EPS, guidance raised, rating
      constructive. Driver: data center / accelerated computing demand.
    must_contain: ["$30.0B", "$5.16", "raised"]
    must_not_contain: ["lowered", "miss"]

  - id: golden_ko_miss_lowered
    capability: writer
    prompt: "Summarise and rate."
    context: |
      Stark Beverages Q4 FY26. Revenue $11.8B vs $12.2B consensus (miss).
      EPS $0.49 vs $0.52. Management lowered FY27 revenue guidance citing
      softer LatAm demand and an FX drag of ~3%.
    expected: |
      Miss on top and bottom line, guidance lowered, rating cautious.
    must_contain: ["$11.8B", "lowered", "$0.49"]
    must_not_contain: ["raised", "beat"]

  - id: golden_jpm_beat_buyback
    capability: writer
    prompt: "Note the capital return commentary."
    context: |
      Wayne Financial Q1 FY26. Net interest income $23.1B vs $22.4B consensus.
      EPS $4.81 vs $4.32. Announced a new $25B buyback authorisation. Management
      maintained NII guidance for the year at $89B.
    expected: |
      Strong beat, capital return positive ($25B buyback), guidance maintained,
      rating constructive.
    must_contain: ["$23.1B", "$25B buyback", "maintained"]
    must_not_contain: ["lowered"]

  - id: golden_research_extraction
    capability: researcher
    prompt: "Extract the key facts from this transcript."
    context: |
      Soylent Foods Q3 FY26. Revenue $4.2B (consensus $4.05B), EPS $1.12 (consensus
      $1.03). Raised full-year EPS guidance to $4.40–$4.55 from $4.20–$4.35.
      CFO: "We are pleased with the margin expansion driven by pricing actions."
    expected: |
      Revenue $4.2B vs $4.05B consensus; EPS $1.12 vs $1.03 consensus; guidance
      raised; quote about margin expansion via pricing.
    must_contain: ["$4.2B", "$1.12", "raised"]
    must_not_contain: ["$5B", "lowered"]

  - id: golden_research_no_consensus
    capability: researcher
    prompt: "Extract facts."
    context: |
      Cyberdyne Robotics Q2 FY26. Revenue $890M, up 24% YoY. Adjusted EPS
      $0.34. Reaffirmed FY26 guidance of $3.6–3.8B revenue. No consensus
      comparison was discussed on the call.
    expected: |
      Revenue $890M (no consensus referenced), EPS $0.34, guidance reaffirmed
      at $3.6–3.8B.
    must_contain: ["$890M", "$0.34", "reaffirmed"]
    must_not_contain: ["consensus of"]

  - id: golden_analyst_beat_miss
    capability: analyst
    prompt: "Classify beat/miss and identify drivers."
    context: |
      Extracted facts: Revenue $7.8B vs $7.5B consensus (+4%); EPS $1.42 vs
      $1.38 (+2.9%); guidance raised; driver = enterprise renewal cohort.
    expected: |
      Beat on both lines, guidance raised, driver is enterprise renewals.
    must_contain: ["beat", "raised", "enterprise"]
    must_not_contain: ["miss", "lowered"]

  - id: golden_reviewer_pass
    capability: reviewer
    prompt: "Verify the note matches the transcript."
    context: |
      Transcript: Revenue $5.0B, EPS $0.88, guidance raised.
      Note: "Q3 beat. Revenue $5.0B and EPS $0.88. Guidance raised. Rating
      constructive."
    expected: |
      PASS — all numbers match.
    must_contain: ["PASS"]
    must_not_contain: ["FAIL"]

  - id: golden_orch_full_workflow
    capability: orchestrator
    prompt: "Run the full earnings workflow and emit a client note."
    context: |
      Umbrella Pharma Q2 FY26. Revenue $9.8B vs $9.6B consensus. EPS $1.85 vs
      $1.78. Raised full-year revenue guidance to $39.0–39.5B from $38.5–39.0B.
      Management cited stronger oncology franchise sales and pricing in the US.
    expected: |
      A clean 4-sentence note with the right numbers, raised guidance,
      constructive rating; compliance review PASS.
    must_contain: ["$9.8B", "$1.85", "raised", "PASS"]
    must_not_contain: ["FAIL", "lowered"]

  - id: golden_orch_segment_detail
    capability: orchestrator
    prompt: "Note segment commentary."
    context: |
      Tyrell Industries Q4 FY26. Total revenue $18.2B vs $17.9B consensus.
      Cloud segment $9.1B (+22% YoY), Hardware $6.4B (-3% YoY), Services $2.7B
      (+4%). EPS $3.10 vs $2.95. Guidance maintained.
    expected: |
      Beat overall, cloud strong, hardware soft, guidance maintained.
    must_contain: ["$18.2B", "$3.10", "maintained"]
    must_not_contain: ["raised", "lowered"]

  - id: golden_writer_macro_callout
    capability: writer
    prompt: "Capture the macro commentary."
    context: |
      Pied Piper Logistics Q1 FY26. Revenue $2.1B vs $2.05B consensus. EPS $0.42
      vs $0.40. Guidance maintained. CEO highlighted a "softening freight
      environment in Europe" and FX headwind of 1.5pt.
    expected: |
      Inline beat, macro softness in Europe + FX flagged, rating neutral.
    must_contain: ["$2.1B", "$0.42", "maintained"]
    must_not_contain: ["raised"]

  - id: golden_analyst_guidance_raise
    capability: analyst
    prompt: "Summarise the guidance change."
    context: |
      Extracted facts: prior FY guidance $20.0–20.4B revenue; new guidance
      $20.6–21.0B; midpoint up 2.5%. EPS guidance unchanged.
    expected: |
      Revenue guidance raised ~2.5% at the midpoint; EPS guidance unchanged.
    must_contain: ["raised", "midpoint"]
    must_not_contain: ["lowered"]

  - id: golden_reviewer_clean
    capability: reviewer
    prompt: "Verify."
    context: |
      Transcript: revenue $3.3B, EPS $0.77.
      Note: "Q3 inline. Revenue $3.3B, EPS $0.77, guidance maintained,
      rating neutral."
    expected: |
      PASS, numbers match, guidance language acceptable.
    must_contain: ["PASS"]
    must_not_contain: ["FAIL"]

  - id: golden_writer_buyback_dividend
    capability: writer
    prompt: "Cover the capital return."
    context: |
      Hooli Corp Q1 FY26. Revenue $76.5B vs $75.8B consensus. EPS $2.05 vs
      $1.94. Announced 5% dividend increase. Raised FY guidance.
    expected: |
      Beat, 5% dividend hike, raised guidance, constructive rating.
    must_contain: ["$76.5B", "5%", "raised"]
    must_not_contain: ["lowered", "cut"]
