name: Deployment Readiness Eval

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "Harness mode (mock | live). Live requires ANTHROPIC_API_KEY secret."
        required: false
        default: "auto"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.run.outputs.verdict }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('dashboard/pnpm-lock.yaml', 'dashboard/package.json') }}

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install dashboard deps
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Decide harness mode
        id: mode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          requested="${INPUT_MODE:-auto}"
          if [ "$requested" = "live" ]; then mode=live
          elif [ "$requested" = "mock" ]; then mode=mock
          elif [ -n "$ANTHROPIC_API_KEY" ]; then mode=live
          else mode=mock
          fi
          echo "Selected mode: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: python -m pytest tests/ -q

      - name: Run evaluation suite
        id: run
        env:
          HARNESS_MODE: ${{ steps.mode.outputs.mode }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python -m harness.run
          exit_code=$?
          set -e
          if [ "$exit_code" = "0" ]; then
            echo "verdict=GO" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=NO-GO" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy run.json into dashboard/public
        run: cp reports/latest/run.json dashboard/public/run.json

      - name: Build dashboard
        working-directory: dashboard
        env:
          BASE_PATH: /Wand-deployment-readiness-score
        run: pnpm build

      - name: Upload artifacts (raw report + dashboard)
        uses: actions/upload-artifact@v4
        with:
          name: readiness-bundle
          path: |
            reports/
            dashboard/out/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/out

      - name: Job summary
        run: |
          {
            echo "## Wand Deployment Readiness — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "- Mode: \`${{ steps.mode.outputs.mode }}\`"
            echo "- Verdict: **${{ steps.run.outputs.verdict }}**"
            echo "- Dashboard built from \`reports/latest/run.json\` → \`dashboard/out/\`"
            echo ""
            echo "Public report (after deploy step): https://ragsivanandan-byte.github.io/Wand-deployment-readiness-score/"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: eval
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
