<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c9cff"/>
    </marker>
    <style>
      .panel  { fill: #182146; stroke: #233063; stroke-width: 1; rx: 8; }
      .accent { fill: #1a2654; stroke: #3a5cd5; stroke-width: 1.5; rx: 8; }
      .judge  { fill: #2a1a4d; stroke: #7c5cd5; stroke-width: 1.5; rx: 8; }
      .report { fill: #0d3f2c; stroke: #10b981; stroke-width: 1.5; rx: 8; }
      .title  { fill: #e6ebff; font-size: 14px; font-weight: 600; }
      .label  { fill: #e6ebff; font-size: 12px; }
      .muted  { fill: #8c97c2; font-size: 11px; }
      .h      { fill: #8c97c2; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
      .conn   { stroke: #7c9cff; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="900" height="480" fill="#0b1020"/>

  <!-- Title -->
  <text x="40" y="34" class="title" font-size="16">Wand Deployment Readiness Harness — pipeline</text>
  <text x="40" y="52" class="muted">push → load cases → run target agent → judge → render report → publish</text>

  <!-- Test cases panel -->
  <g>
    <text x="40" y="92" class="h">1. Test cases</text>
    <rect x="40" y="100" width="170" height="100" class="panel"/>
    <text x="56" y="124" class="label">test_cases/</text>
    <text x="56" y="144" class="muted">golden.yaml         (15)</text>
    <text x="56" y="160" class="muted">adversarial.yaml    (10)</text>
    <text x="56" y="176" class="muted">edge_cases.yaml      (8)</text>
    <text x="56" y="192" class="muted">33 cases total</text>
  </g>

  <!-- Target agent panel -->
  <g>
    <text x="250" y="92" class="h">2. Target agent (claude-haiku-4-5)</text>
    <rect x="250" y="100" width="370" height="160" class="accent"/>
    <text x="266" y="124" class="label">target_agent/orchestrator.py</text>

    <rect x="266" y="138" width="78" height="42" class="panel"/>
    <text x="275" y="156" class="label" font-size="11">researcher</text>
    <text x="275" y="170" class="muted" font-size="10">extract</text>

    <rect x="354" y="138" width="78" height="42" class="panel"/>
    <text x="363" y="156" class="label" font-size="11">analyst</text>
    <text x="363" y="170" class="muted" font-size="10">classify</text>

    <rect x="442" y="138" width="78" height="42" class="panel"/>
    <text x="451" y="156" class="label" font-size="11">writer</text>
    <text x="451" y="170" class="muted" font-size="10">draft note</text>

    <rect x="530" y="138" width="78" height="42" class="panel"/>
    <text x="539" y="156" class="label" font-size="11">reviewer</text>
    <text x="546" y="170" class="muted" font-size="10">cross-check</text>

    <!-- arrows between sub-agents -->
    <path d="M 344 159 L 354 159" class="conn"/>
    <path d="M 432 159 L 442 159" class="conn"/>
    <path d="M 520 159 L 530 159" class="conn"/>

    <text x="266" y="208" class="muted">Plain Python orchestrator (50 LOC)</text>
    <text x="266" y="226" class="muted">Swap adapters.py to evaluate any other system.</text>
    <text x="266" y="244" class="muted">Mock mode produces deterministic seeded outputs for offline dev.</text>
  </g>

  <!-- Judge panel -->
  <g>
    <text x="660" y="92" class="h">3. Judge (claude-sonnet-4-6)</text>
    <rect x="660" y="100" width="200" height="160" class="judge"/>
    <text x="676" y="124" class="label">harness/judge.py</text>
    <text x="676" y="148" class="muted">Versioned rubric (v1.0)</text>
    <text x="676" y="166" class="muted">3-axis JSON verdict:</text>
    <text x="690" y="182" class="muted">· task_success 0|1</text>
    <text x="690" y="198" class="muted">· hallucination 0–3</text>
    <text x="690" y="214" class="muted">· instruction_follow 0–3</text>
    <text x="676" y="238" class="muted">Rubric hash embedded</text>
    <text x="676" y="252" class="muted">in every report.</text>
  </g>

  <!-- Aggregation -->
  <g>
    <text x="40" y="296" class="h">4. Aggregate &amp; threshold</text>
    <rect x="40" y="304" width="280" height="120" class="panel"/>
    <text x="56" y="328" class="label">harness/report.py</text>
    <text x="56" y="350" class="muted">5 readiness gates:</text>
    <text x="56" y="368" class="muted">task success ≥ 80% · hallucination ≤ 10%</text>
    <text x="56" y="384" class="muted">instr ≥ 0.85 · p95 ≤ 8s · cost ≤ $0.05</text>
    <text x="56" y="406" class="muted">capability × axis heatmap + regression diff</text>
  </g>

  <!-- Report -->
  <g>
    <text x="360" y="296" class="h">5. HTML report</text>
    <rect x="360" y="304" width="260" height="120" class="report"/>
    <text x="376" y="328" class="label">reports/latest/index.html</text>
    <text x="376" y="350" class="muted">GO / NO-GO verdict banner</text>
    <text x="376" y="368" class="muted">5-tile metric summary</text>
    <text x="376" y="384" class="muted">heatmap · failing cases · cost / step</text>
    <text x="376" y="406" class="muted">single self-contained .html file</text>
  </g>

  <!-- CI -->
  <g>
    <text x="660" y="296" class="h">6. CI / Pages</text>
    <rect x="660" y="304" width="200" height="120" class="panel"/>
    <text x="676" y="328" class="label">.github/workflows/eval.yml</text>
    <text x="676" y="350" class="muted">on push: pytest → run → publish</text>
    <text x="676" y="368" class="muted">live if ANTHROPIC_API_KEY set,</text>
    <text x="676" y="384" class="muted">mock otherwise.</text>
    <text x="676" y="406" class="muted">→ GitHub Pages (public URL)</text>
  </g>

  <!-- Cross-section arrows -->
  <path d="M 210 150 L 250 150" class="conn"/>
  <path d="M 620 178 L 660 178" class="conn"/>
  <path d="M 435 260 L 435 304" class="conn"/>
  <path d="M 320 364 L 360 364" class="conn"/>
  <path d="M 620 364 L 660 364" class="conn"/>

  <!-- Footer caption -->
  <text x="40" y="460" class="muted">No LangChain, no LangGraph. ~800 LOC of Python + Jinja. Designed to be read end-to-end in 20 minutes.</text>
</svg>
