[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wand-deployment-readiness-harness"
version = "0.1.0"
description = "Evaluation harness for measuring multi-agent system production readiness — finance vertical."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40,<1.0",
    "pydantic>=2.5,<3.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["harness*", "target_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
